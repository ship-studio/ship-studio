name: Release Windows

on:
  push:
    tags:
      - '*-win'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:all
      - run: pnpm test:run
      - name: Build Harbr
        run: pnpm tauri build --bundles nsis
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          source_file=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' -type f -print -quit)
          test -n "$source_file"
          mkdir -p artifacts
          cp "$source_file" artifacts/Harbr_windows-x86_64-setup.exe
      - uses: actions/upload-artifact@v6
        with:
          name: Harbr-windows-x86_64
          path: artifacts/Harbr_windows-x86_64-setup.exe
          if-no-files-found: error
      - name: Add artifact to draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Harbr_windows-x86_64-setup.exe
          draft: true
          generate_release_notes: true
