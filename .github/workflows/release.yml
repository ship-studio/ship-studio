name: Release macOS

on:
  push:
    tags:
      - 'v*'
      - '!*-win'
      - '!*-linux'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:all
      - run: pnpm test:run
      - name: Build Harbr
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          source_file=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)
          test -n "$source_file"
          mkdir -p artifacts
          cp "$source_file" artifacts/Harbr_darwin-universal.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: Harbr-darwin-universal
          path: artifacts/Harbr_darwin-universal.dmg
          if-no-files-found: error
      - name: Add artifact to draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Harbr_darwin-universal.dmg
          draft: true
          generate_release_notes: true
