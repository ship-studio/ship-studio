[package]
name = "harbr"
version = "0.1.0"
description = "A self-hosted workspace for AI-assisted development."
authors = ["Gaya KACI", "Harbr contributors"]
license = "MIT"
repository = "https://github.com/kacigaya/harbr"
homepage = "https://github.com/kacigaya/harbr"
edition = "2021"

# Pattern enforcement lints — see also src-tauri/clippy.toml for disallowed-methods.
# unwrap/expect are WARN (not deny) because the existing codebase has many sites
# that would block CI immediately. Per-module migration raises these to deny as
# sites are paid down.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lib]
name = "ship_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The desktop app. Declared explicitly because adding the server bin below
# turns off Cargo's bin autodiscovery for src/main.rs.
[[bin]]
name = "harbr"
path = "src/main.rs"

# The self-hosted server. Only builds with `--features web`, so the default
# desktop build is untouched.
[[bin]]
name = "harbr-server"
path = "src/bin/server.rs"
required-features = ["web"]

[features]
default = []
# HTTP + WebSocket transport for the self-hosted deployment.
web = ["dep:axum", "dep:tower-http"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-pty = { path = "plugins/tauri-plugin-pty" }
ship-studio-macros = { path = "macros" }
portable-pty = { version = "0.9.0", features = ["serde_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "process", "io-util", "net"] }
dirs = "5"
which = "6"
base64 = "0.22"
url = "2"
tauri-plugin-screenshots = "2.2.0"
tauri-plugin-fs = "2"
# jpeg/gif/webp: custom thumbnail uploads decode whatever the user drags in
# (saved back out as PNG); png-only rejected every JPEG upload (issue #561).
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2"
semver = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
once_cell = "1.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = "2"
tauri-plugin-dialog = "2"
walkdir = "2"
ignore = "0.4"
dunce = "1"
urlencoding = "2"
hyper = { version = "1", features = ["http1", "server", "client"] }
# Android mirror bridge: WebSocket server streaming screenrecord H.264 to the webview.
tokio-tungstenite = "0.24"
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["tokio", "http1", "server", "client-legacy"] }
http-body-util = "0.1"
bytes = "1"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
# Native clipboard read for Windows terminal paste (WebView2 gates keyboard
# paste behind an async permission wait — see commands/clipboard.rs).
arboard = "3"

# --- Web (self-hosted) transport, feature-gated ---
# Deliberately small: cookies are parsed from the header directly and constant-
# time comparison reuses the `hmac` dep above, so no cookie or crypto crate.
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }

[dev-dependencies]
tempfile = "3"
# Drives the axum Router in-process (`oneshot`) so the auth middleware is
# tested without binding a socket.
tower = { version = "0.5", features = ["util"] }

# macOS-specific dependencies for WebKit JavaScript evaluation
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry", "NSData"] }
block2 = "0.5"
